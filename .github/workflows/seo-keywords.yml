name: SEO keyword candidates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/generate_seo_keywords.py
      - uses: actions/upload-artifact@v4
        with:
          name: seo-keyword-candidates
          path: seo/keyword-candidates.csv
