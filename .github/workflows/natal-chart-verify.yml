name: Natal chart verification
on:
  push:
    branches: [feature/natal-chart-swiss-ephemeris, audit/natal-reference-agpl]
  pull_request:
    paths:
      - 'angular/**'
      - '.github/workflows/natal-chart-verify.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: angular/package-lock.json
      - name: Regenerate and commit npm lockfile
        working-directory: angular
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize natal chart npm lockfile"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi
      - name: Install dependencies
        working-directory: angular
        run: npm ci
      - name: Check tests and production compilation
        working-directory: angular
        run: |
          npm run check:structure
          npm test
          npm run build
      - name: Check WASM assets
        working-directory: angular
        run: |
          find node_modules/@swisseph/browser -iname '*.wasm' -print
          find dist -iname '*.wasm' -print
