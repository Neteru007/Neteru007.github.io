<div class="catalog-filters">
  <mat-form-field appearance="outline" subscriptSizing="dynamic"
    ><mat-label>Ім’я або номер</mat-label
    ><input
      matInput
      #searchInput
      type="search"
      [value]="query()"
      (input)="query.set(searchInput.value)"
      maxlength="80"
      placeholder="Українською, латиною або номер" /></mat-form-field
  ><mat-form-field appearance="outline" subscriptSizing="dynamic"
    ><mat-label>Стихія знака</mat-label
    ><select
      matNativeControl
      #elementInput
      [value]="element()"
      (change)="element.set(elementInput.value)"
    >
      <option value="">Усі стихії</option>
      @for (value of elements; track value) {
        <option [value]="value">{{ value }}</option>
      }
    </select></mat-form-field
  ><mat-form-field appearance="outline" subscriptSizing="dynamic"
    ><mat-label>Планета</mat-label
    ><select
      matNativeControl
      #planetInput
      [value]="planet()"
      (change)="planet.set(planetInput.value)"
    >
      <option value="">Усі планети</option>
      @for (value of planets; track value) {
        <option [value]="value">{{ value }}</option>
      }
    </select></mat-form-field
  >
  @if (kind() === 'demons') {
    <mat-form-field appearance="outline" subscriptSizing="dynamic"
      ><mat-label>Ранг</mat-label
      ><select matNativeControl #rankInput [value]="rank()" (change)="rank.set(rankInput.value)">
        <option value="">Усі ранги</option>
        @for (value of ranks(); track value) {
          <option [value]="value">{{ value }}</option>
        }
      </select></mat-form-field
    >
    <mat-form-field appearance="outline" subscriptSizing="dynamic"
      ><mat-label>Тип зображення</mat-label
      ><select
        matNativeControl
        #imageInput
        [value]="imageType()"
        (change)="imageType.set(imageInput.value)"
      >
        <option value="">Усі зображення</option>
        <option value="portrait">Історичні ілюстрації</option>
        <option value="document">Уривки з джерела</option>
      </select></mat-form-field
    >
  }
</div>
